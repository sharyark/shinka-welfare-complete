{% extends "admin/base_site.html" %}

{% block content %}
<div class="max-w-xl">
  <h2 class="font-semibold text-lg mb-2">{{ title }}</h2>
  <p class="mb-4">This applies to:</p>
  <ul class="list-disc ml-6 mb-6">
    {% for obj in queryset %}<li>{{ obj }}</li>{% endfor %}
  </ul>
  <form method="post">
    {% csrf_token %}
    {% for obj in queryset %}<input type="hidden" name="_selected_action" value="{{ obj.pk }}">{% endfor %}
    <input type="hidden" name="action" value="{{ action }}">
    <input type="hidden" name="apply" value="1">
    <label for="id_reason" class="block font-medium mb-1">{{ label|default:"Reason" }} (required)</label>
    <input id="id_reason" name="reason" required maxlength="255"
           class="border rounded-md px-3 py-2 w-full mb-4 bg-white dark:bg-gray-900">
    <button type="submit" class="bg-primary-600 text-white rounded-md px-4 py-2">Confirm</button>
    <a href="" onclick="history.back(); return false;" class="ml-3">Cancel</a>
  </form>
</div>
{% endblock %}
